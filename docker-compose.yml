version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5003:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank-app
      - PORT=5000
      - JWT_ACCESS_SECRET=yourAccessSecret
      - JWT_REFRESH_SECRET=yourRefreshSecret
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
